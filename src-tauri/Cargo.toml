[package]
name = "touchless"
version = "0.1.0"
edition = "2024"
default-run = "touchless"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.18"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
rubato = "5"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml_edit = "0.25"
url = "2"
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSButton",
    "NSControl",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSSound",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSString",
] }
security-framework = "3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
