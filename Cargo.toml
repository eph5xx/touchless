[package]
name = "touchless"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
cpal = "0.18"
dotenvy = "0.15"
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
